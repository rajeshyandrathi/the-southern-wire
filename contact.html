<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — The Southern Wire</title>
<meta name="description" content="Get in touch with The Southern Wire — corrections, tips, or advertising enquiries.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/widgets.css">
<style>
  :root{ --bg:#ffffff; --surface:#f7f5f1; --text:#141414; --text-dim:#5c5c5c; --border:rgba(0,0,0,0.13); --accent:#2f8fe0; --accent-soft:#e3f2fd; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0b0f14; --surface:#12181f; --text:#f2f2f0; --text-dim:#a3a3a0; --border:rgba(255,255,255,0.15); --accent:#6cc0ff; --accent-soft:#122a3d; }
  }
  :root[data-theme="dark"]{ --bg:#0b0f14; --surface:#12181f; --text:#f2f2f0; --text-dim:#a3a3a0; --border:rgba(255,255,255,0.15); --accent:#6cc0ff; --accent-soft:#122a3d; }
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:620px;margin-inline:auto;padding-inline:20px;}
  header.topbar{border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding-block:16px;gap:12px;flex-wrap:wrap;max-width:1080px;margin-inline:auto;padding-inline:20px;}
  .brand{font-family:'Playfair Display',serif;font-weight:800;font-size:1.35rem;letter-spacing:-0.01em;}
  .brand .dot{color:var(--accent);}
  .topbar-meta{font-size:0.8rem;color:var(--text-dim);font-weight:500;}
  .topbar-meta a:hover{color:var(--accent);}
  main{padding-block:36px 60px;}
  .back-link{font-size:0.85rem;color:var(--text-dim);margin-bottom:20px;display:inline-block;}
  .back-link:hover{color:var(--accent);}
  h1{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(1.9rem,4.4vw,2.8rem);line-height:1.1;letter-spacing:-0.005em;margin:0 0 14px;color:var(--text);border-top:3px solid var(--accent);padding-top:20px;}
  p.lede{font-size:1.02rem;line-height:1.6;color:var(--text-dim);margin:0 0 28px;}
  form{display:flex;flex-direction:column;gap:14px;}
  label{font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin-bottom:6px;display:block;}
  input, select, textarea{
    width:100%;font-family:'Inter',sans-serif;font-size:0.96rem;padding:11px 13px;
    border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);
  }
  textarea{min-height:140px;resize:vertical;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button{
    font-family:'Inter',sans-serif;font-weight:700;font-size:0.9rem;text-transform:uppercase;letter-spacing:0.03em;
    padding:13px 20px;border:none;border-radius:3px;background:var(--accent);color:#fff;cursor:pointer;align-self:flex-start;
  }
  button:hover{opacity:0.9;}
  .form-msg{font-size:0.9rem;margin-top:14px;display:none;}
  .form-msg.sw-show{display:block;}
  footer{margin-top:40px;padding-top:24px;border-top:1px solid var(--border);font-size:0.82rem;color:var(--text-dim);line-height:1.7;}
  footer p{max-width:70ch;margin:0 0 8px;}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">The Southern<span class="dot">.</span>Wire</div>
    <div class="topbar-meta"><a href="index.html">Home</a></div>
  </div>
</header>

<main class="wrap">
  <a class="back-link" href="index.html">&larr; Back to today's edition</a>
  <h1>Contact</h1>
  <p class="lede">Spotted an error? Have a tip? Interested in advertising? Send us a message and we'll get back to you.</p>

  <form id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contact">
    <p hidden><label>Don&rsquo;t fill this out: <input name="bot-field"></label></p>

    <div>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div>
      <label for="reason">Reason</label>
      <select id="reason" name="reason">
        <option>Correction</option>
        <option>News tip</option>
        <option>Advertising enquiry</option>
        <option>Other</option>
      </select>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <button type="submit">Send message</button>
    <p class="form-msg"></p>
  </form>

  <footer>
    <p>Published from Johannesburg, South Africa.</p>
  </footer>
</main>
<script src="assets/config.js"></script>
<script src="assets/site.js"></script>
<script>
  document.getElementById("contact-form").addEventListener("submit", function(ev){
    ev.preventDefault();
    var form = ev.target;
    var data = new FormData(form);
    var msg = document.querySelector(".form-msg");
    fetch("/", { method: "POST", body: data })
      .then(function(){
        msg.textContent = "Thanks — your message has been sent.";
        msg.classList.add("sw-show");
        form.reset();
      })
      .catch(function(){
        msg.textContent = "Something went wrong — please try again later.";
        msg.classList.add("sw-show");
      });
  });
</script>
</body>
</html>
